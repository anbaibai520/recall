<script>
/* ==========================================================================
   启动引导（必须排在主脚本之前）
   作用：APK 内置的是某个固定版本的页面，本函数负责在「本地缓存里存在更新的 UI」
   时用缓存重建整个文档 —— 于是换 UI 不需要重装 APK。
   前提：清缓存后回落内置页；数据在 IndexedDB，与本引导无关，UI 更新不会动数据。
   注意：BUILTIN 必须与主脚本里的 APP_VERSION 保持一致（smoke.mjs 有断言守着）。
   ========================================================================== */
(function () {
  var BUILTIN = "1.1.0";
  var CACHE_KEY = "recall-ui-cache";
  function parts(v) { return String(v || "0").split(".").map(function (x) { return parseInt(x, 10) || 0; }); }
  function newer(a, b) {
    var A = parts(a), B = parts(b);
    for (var i = 0; i < 3; i++) { if ((A[i] || 0) !== (B[i] || 0)) return (A[i] || 0) > (B[i] || 0); }
    return false;
  }
  try {
    var c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    if (c && c.html && c.version && newer(c.version, BUILTIN)) {
      document.open(); document.write(c.html); document.close();
    }
  } catch (e) { /* 缓存损坏就当没有 */ }
})();

<style>

<script>
"use strict";
/* ==========================================================================
   Recall · 提取式单词记忆
   实现依据：《单词记忆软件功能规格文档 v1.0》 MVP(P0) + v1.1(P1)
   模块映射：M1 内容 / M2 引擎 / M3 交互 / M4 释义 / M5 语境 / M6 助记
            / M7 睡前 / M9 统计 / M10 设置
   UI 软更新：APK 只做壳，启动时按 version.json 拉取更新的页面缓存到本地，
              下次启动由 head 里的引导脚本用缓存重建页面（见 UI_UPDATE 段）。
   ========================================================================== */
const APP_VERSION = "1.1.0";
const UI_CACHE_KEY = "recall-ui-cache";
const UI_IGNORED_KEY = "ui-ignored-version";
const UI_MAX_CACHE_CHARS = 1200000;   // 超过就别缓存了：部分 WebView 的 localStorage 只有 5MB
const DEFAULT_UPDATE_MANIFEST = "";   // 例：https://<你的用户名>.github.io/recall/version.json

/* ---------- 0. 基础工具 ---------- */
const $ = (id) => document.getElementById(id);
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
const DAY = 86400000;
const now = () => Date.now();
const uid = (p) => p + "_" + now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dayKey = (ts) => { const d = new Date(ts); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const dayStart = (ts) => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDur = (ms) => {
  if (ms == null || !isFinite(ms)) return "—";
  const s = Math.round(ms / 1000);
  if (s < 60) return s + " 秒";
  const m = Math.round(s / 60);
  if (m < 60) return m + " 分";
  const h = Math.floor(m / 60), rm = m % 60;
  return rm ? h + " 时 " + rm + " 分" : h + " 时";
};
const fmtDays = (d) => d == null ? "—" : (d < 1 ? (d * 24 < 1 ? Math.round(d * 24 * 60) + " 分" : Math.round(d * 24) + " 时") : (d < 30 ? (Math.round(d * 10) / 10) + " 天" : (Math.round(d / 3) / 10) + " 月"));
const pct = (v) => (Math.round(v * 1000) / 10) + "%";
function toast(msg, ms) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), ms || 2200);
}
function modal(title, bodyNode, actions) {
  const root = $("modal-root"); root.innerHTML = "";
  const mask = el("div", "mask");
  const m = el("div", "modal");
  m.appendChild(el("h3", null, esc(title)));
  if (bodyNode) m.appendChild(bodyNode);
  const bar = el("div", "row", ""); bar.style.cssText = "justify-content:flex-end;gap:8px;margin-top:14px";
  (actions || [{ t: "关闭", p: false }]).forEach((a) => {
    const b = el("button", "btn " + (a.p ? "primary" : ""), esc(a.t));
    b.onclick = () => { if (a.fn) { if (a.fn(m) === false) return; } closeModal(); };
    bar.appendChild(b);
  });
  m.appendChild(bar); mask.appendChild(m); root.appendChild(mask);
  mask.onclick = (e) => { if (e.target === mask) closeModal(); };
  return m;
}
function closeModal() { $("modal-root").innerHTML = ""; }

/* ---------- 1. FSRS-5 内核（直接采用开源 FSRS，不自研 —— FR-M2-01 / EV-01） ---------- */
const FSRS_FACTOR = 19 / 81;
const FSRS = {
  // 官方默认参数（19 项），可在「设置 → 高级」替换为用户历史优化后的参数
  w: [0.40255, 1.18385, 3.173, 15.69105, 7.1949, 0.5345, 1.4604, 0.0046, 1.54575,
      0.1192, 1.01925, 1.9395, 0.11, 0.29605, 2.2698, 0.2315, 2.9898, 0.51655, 0.6621],
  fuzz: true,
  _rij() { return Math.random(); },
  initialStability(g, w) { return Math.max(0.1, w[g - 1]); },
  initialDifficulty(g, w) { return clamp(w[4] - Math.exp(w[5] * (g - 1)) + 1, 1, 10); },
  retrievability(tDays, stability, w) {
    const decay = -(w ? w[17] : FSRS.w[17]);
    return Math.pow(1 + FSRS_FACTOR * Math.max(0, tDays) / Math.max(0.1, stability), decay);
  },
  intervalForRetention(stability, retention, w) {
    const decay = -(w ? w[17] : FSRS.w[17]);
    return (stability / FSRS_FACTOR) * (Math.pow(retention, 1 / decay) - 1);
  },
  _meanReversion(target, current, w) { return w[7] * target + (1 - w[7]) * current; },
  nextDifficulty(d, g, w) {
    const nd = FSRS._meanReversion(FSRS.initialDifficulty(4, w), d - w[6] * (g - 3), w);
    return clamp(nd, 1, 10);
  },
  _meanReversionStable(d, s, r, g, w) {
    const hardPenalty = g === 2 ? w[15] : 1;
    const easyBound = g === 4 ? w[16] : 1;
    const growth = Math.exp(w[8]) * (11 - d) * Math.pow(s, -w[9]) * (Math.exp((1 - r) * w[10]) - 1) * hardPenalty * easyBound;
    let next = s * (1 + growth);
    const shortTerm = s / Math.exp(w[17] * w[18]);
    next = Math.max(next, shortTerm);
    return clamp(next, 0.1, 36500);
  },
  stabilitySuccess(s, r, d, g, w) { return FSRS._meanReversionStable(d, s, r, g, w); },
  stabilityFail(s, r, d, w) {
    const nv = w[11] * Math.pow(d, -w[12]) * (Math.pow(s + 1, w[13]) - 1) * Math.exp((1 - r) * w[14]);
    return clamp(Math.min(nv, s), 0.1, 36500);
  },
  /** 应用一次复习。state:{stability,difficulty} -> 新状态 + 下次间隔(天) */
  review(state, g, tDays, reqRetention, w, maxIntervalDays) {
    const W = w || FSRS.w;
    const s0 = state.stability, d0 = state.difficulty;
    const r = FSRS.retrievability(tDays, s0, W);
    let s, d;
    if (g === 1) { d = FSRS.nextDifficulty(d0, g, W); s = FSRS.stabilityFail(s0, r, d, W); }
    else { d = FSRS.nextDifficulty(d0, g, W); s = FSRS.stabilitySuccess(s0, r, d, g, W); }
    let ivl = FSRS.intervalForRetention(s, reqRetention, W);
    const cap = maxIntervalDays || 365;
    ivl = clamp(ivl, 0.0035, cap);                      // 最小 5 分钟
    if (FSRS.fuzz && ivl >= 2) {
      const lo = Math.max(2, Math.round(ivl * 0.95)), hi = Math.round(ivl * 1.05);
      if (hi > lo) ivl = lo + Math.floor(FSRS._rij() * (hi - lo + 1));
    }
    return { stability: s, difficulty: d, retrievability: r, intervalDays: ivl };
  },
  /** 新卡初始状态：自评/首评 g（1..4） */
  initState(g, w) { const W = w || FSRS.w; return { stability: FSRS.initialStability(g, W), difficulty: FSRS.initialDifficulty(g, W) }; }
};

/* ---------- 3. 存储层（IndexedDB；图像为 Blob，离线本地优先 —— FR 9 离线/隐私） ---------- */
const DB = (() => {
  const NAME = "recall_db", VER = 1;
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const rq = indexedDB.open(NAME, VER);
      rq.onupgradeneeded = (e) => {
        const db = e.target.result;
        const mk = (n, kp, opts) => { if (!db.objectStoreNames.contains(n)) db.createObjectStore(n, Object.assign({ keyPath: kp }, opts || {})); };
        mk("kv");
        mk("words", "word_id");
        mk("senses", "sense_id");
        mk("sentences", "sentence_id");
        mk("cards", "card_id");
        mk("mnemonics", "mnemonic_id");
        mk("history", "hid");
        const t0 = e.target.transaction;
        const LG = db.createObjectStore("logs", { keyPath: "log_id", autoIncrement: true });
        LG.createIndex("reviewed_at", "reviewed_at");
        LG.createIndex("card_id", "card_id");
        t0.objectStore("senses").createIndex("word_id", "word_id");
        t0.objectStore("sentences").createIndex("sense_id", "sense_id");
        t0.objectStore("cards").createIndex("due_at", "due_at");
        t0.objectStore("cards").createIndex("sense_id", "sense_id");
        t0.objectStore("mnemonics").createIndex("sense_id", "sense_id");
      };
      rq.onsuccess = (e) => res(e.target.result);
      rq.onerror = (e) => rej(e.target.error);
    });
    return dbp;
  }
  function tx(stores, mode) { return open().then((db) => db.transaction(stores, mode)); }
  function put(store, val) { return tx([store], "readwrite").then((t) => new Promise((r, j) => { const q = t.objectStore(store).put(val); q.onsuccess = () => r(val); q.onerror = (e) => j(e.target.error); })); }
  function bulk(store, vals) { return tx([store], "readwrite").then((t) => new Promise((r, j) => { const o = t.objectStore(store); vals.forEach((v) => o.put(v)); t.oncomplete = () => r(vals.length); t.onerror = (e) => j(e.target.error); })); }
  function del(store, key) { return tx([store], "readwrite").then((t) => new Promise((r, j) => { const q = t.objectStore(store).delete(key); q.onsuccess = () => r(true); q.onerror = (e) => j(e.target.error); })); }
  function get(store, key) { return tx([store], "readonly").then((t) => new Promise((r, j) => { const q = t.objectStore(store).get(key); q.onsuccess = () => r(q.result); q.onerror = (e) => j(e.target.error); })); }
  function all(store) { return tx([store], "readonly").then((t) => new Promise((r, j) => { const q = t.objectStore(store).getAll(); q.onsuccess = () => r(q.result || []); q.onerror = (e) => j(e.target.error); })); }
  function byIndex(store, idx, key) { return tx([store], "readonly").then((t) => new Promise((r, j) => { const q = t.objectStore(store).index(idx).getAll(key); q.onsuccess = () => r(q.result || []); q.onerror = (e) => j(e.target.error); })); }
  function count(store) { return tx([store], "readonly").then((t) => new Promise((r, j) => { const q = t.objectStore(store).count(); q.onsuccess = () => r(q.result); q.onerror = (e) => j(e.target.error); })); }
  const kv = {
    get: (k, d) => get("kv", k).then((r) => (r == null ? d : (r.v !== undefined ? r.v : d))),
    set: (k, v) => put("kv", { k, v })
  };
  return { open, put, bulk, del, get, all, byIndex, count, kv, tx };
})();

/** FR-M1-05：词频/具体性/学术标注 → 词类，决定释义语言与配图策略 */
function wordClassOf(word, sense) {
  if (!word) return "abstract";
  if (word.academic || (sense && sense.academic)) return "academic";
  if (sense && sense.has_nearsyn) return "synonym";
  if (word.concreteness === "concrete") return (word.frequency_band || 3) <= 2 ? "concrete_lowfreq" : "concrete";
  if (word.concreteness === "abstract") return "abstract";
  return "abstract";
}
function matrixAt(band, cls) {
  const m = (settings().glossMatrix || DEFAULT_GLOSS_MATRIX);
  return ((m[band] || DEFAULT_GLOSS_MATRIX[band] || {})[cls]) || "l1_l2";
}
/** FR-M4-05：单词级覆盖 > 卡片快照（引入时按当时档位） > 当前档位矩阵默认 */
function glossModeFor(word, sense, card) {
  if (word && word.gloss_override) return word.gloss_override;
  if (card && card.gloss_mode) return card.gloss_mode;
  return matrixAt(settings().band, wordClassOf(word, sense));
}
/** 按模式渲染释义；英文模式下中文始终以折叠保留（FR-M4-03），展开不计入进度 */
function renderGloss(o, opts) {
  const primary = [], fold = [];
  const mode = o.mode, l1 = o.l1, l2 = o.l2, etym = o.etym;
  const compact = opts && opts.compact;
  if (mode === "l1") {
    if (l1) primary.push({ l: "中文释义", t: l1 });
    if (l2) fold.push({ l: "English", t: l2 });
  } else if (mode === "l1_l2") {
    if (l1) primary.push({ l: "中文释义", t: l1 });
    if (l2) primary.push({ l: "English", t: l2 });
  } else if (mode === "l2_fold") {
    if (l2) primary.push({ l: "English", t: l2 });
    if (l1) fold.push({ l: "中文释义", t: l1 });
  } else {
    if (l2) primary.push({ l: "English", t: l2 });
    if (etym) primary.push({ l: "词源 Etymology", t: etym });
    if (l1) fold.push({ l: "中文释义", t: l1 });
  }
  let h = "";
  primary.forEach((p) => {
    h += '<div class="defbox"><div class="lh">' + esc(p.l) + '</div><div class="txt">' + esc(p.t) + "</div></div>";
  });
  if (primary.length === 0) h += '<div class="locked">该义项缺少释义，已标记为「内容待补」。</div>';
  if (fold.length) {
    h += '<details class="fold"><summary>查看' + fold.map((f) => f.l).join(" / ") + "（中文兜底，展开不计入学习进度）</summary><div class=\"body\">" +
      fold.map((f) => '<div style="margin-top:6px"><div class="lh tiny muted">' + esc(f.l) + "</div><div>" + esc(f.t) + "</div></div>").join("") + "</div></details>";
  }
  return h;
}

/** FR-M5-03：例句难度控制在可理解范围，超门槛自动降级（不参与轮换） */
function sentencePool(senseId) {
  const all = idx.sentencesOf(senseId);
  const maxD = settings().sentenceDifficultyMax || 5;
  const ok = all.filter((s) => (s.difficulty || 1) <= maxD);
  return { pool: ok.length ? ok : all, degraded: ok.length === 0 && all.length > 0, total: all.length };
}
/** 7.4 例句轮换：排除最近展示，按话题多样性优先；不足 2 条标记「内容待补」 */
function pickSentence(senseId, lastSentenceId) {
  const info = sentencePool(senseId);
  const pool = info.pool.slice();
  if (!pool.length) return { sentence: null, flagged: true };
  if (pool.length < 2) return { sentence: pool[0], flagged: true };
  const last = pool.find((s) => s.sentence_id === lastSentenceId) || null;
  let cand = pool.filter((s) => s.sentence_id !== lastSentenceId);
  if (!cand.length) cand = pool.slice();
  if (last) {
    const diff = cand.filter((s) => s.topic_tag !== last.topic_tag);
    if (diff.length) cand = diff;
  }
  return { sentence: cand[Math.floor(Math.random() * cand.length)], flagged: info.total < 2 };
}
/** FR-M1-03 / FR-M5-02：入库校验——锚定义唯一、例句 ≥3 且 ≥3 个不同话题 */
function validateSense(sense, sens) {
  const issues = [];
  const n1 = sense.anchor_l1 ? 1 : 0, n2 = sense.anchor_l2 ? 1 : 0;
  if (n1 + n2 === 0) issues.push("锚定义缺失");
  if (Array.isArray(sense.anchor_l1) || Array.isArray(sense.anchor_l2)) issues.push("锚定义多于一条（违反单义项原则）");
  const topics = new Set((sens || []).map((s) => s.topic_tag).filter(Boolean));
  if ((sens || []).length < 3) issues.push("例句少于 3 条");
  if (topics.size < 3) issues.push("例句话题去重后不足 3 个");
  return { issues, needsFix: issues.length > 0, topics: topics.size };
}
async function recomputeContentFlags() {
  let flagged = 0;
  for (const s of S.cache.senses) {
    const r = validateSense(s, idx.sentencesOf(s.sense_id));
    if (r.needsFix !== !!s.flagged || r.topics !== s.topic_count) {
      s.flagged = r.needsFix; s.topic_count = r.topics;
      await DB.put("senses", s); flagged++;
    }
  }
  return flagged;
}

const IMPORT_SCHEMA = {

};
/** AI 生成的内容常带 ```json 围栏或前后寒暄，这里剥掉，只取第一个完整 JSON 片段 */
function stripJsonFence(text) {
  let t = String(text || "").replace(/^\uFEFF/, "").trim();
  const fence = t.match(/```(?:json|JSON)?\s*([\s\S]*?)```/);
  if (fence) t = fence[1].trim();
  const a = t.search(/[{[]/), b = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
  if (a >= 0 && b > a) t = t.slice(a, b + 1);
  return t.replace(/,\s*([}\]])/g, "$1");   // 容错：AI 偶尔留下尾逗号
}
function parseImportJSON(text) {
  let data;
  try { data = JSON.parse(stripJsonFence(text)); }
  catch (e) {
    try { data = JSON.parse(String(text).replace(/,\s*([}\]])/g, "$1")); }
    catch (e2) { throw new Error("不是合法 JSON（" + e2.message + "）"); }
  }
  const words = Array.isArray(data) ? data : (data.words || data.items || []);
  if (!Array.isArray(words)) throw new Error("未找到 words 数组");
  return normalizeImport(words);
}
function normalizeImport(words) {
  // 统一为内部三元组，并做入库校验（FR-M1-02 / FR-M3）
  const out = { words: [], senses: [], sentences: [], rejected: [], flagged: [] };
  words.forEach((w, wi) => {
    const lemma = (w.lemma || w.word || w.headword || "").trim();
    if (!lemma) { out.rejected.push({ lemma: "#" + wi, reason: "缺少词形 lemma" }); return; }
    const wid = uid("w");
    out.words.push({
      word_id: wid, lemma: lemma, pos: (w.pos || "").trim(),
      frequency_band: clamp(parseInt(w.frequency_band || w.freq, 10) || 3, 1, 5),
      concreteness: (w.concreteness === "concrete" || w.concrete === true) ? "concrete" : (w.concreteness === "abstract" ? "abstract" : (w.concreteness || "")),
      academic: !!(w.academic || w.awl),
      audio_url: w.audio_url || "",
      gloss_override: w.gloss_override || null,
      source: w.source || "import", created_at: now()
    });
    const senses = w.senses || w.meanings || (w.anchor_l1 ? [{ anchor_l1: w.anchor_l1, anchor_l2: w.anchor_l2, sentences: w.sentences || [] }] : []);
    (Array.isArray(senses) ? senses : []).forEach((sn, si) => {
      const sid = uid("s");
      const sents = (sn.sentences || sn.examples || []).map((x) => (typeof x === "string" ? { text: x } : x));
      const chk = validateSense(sn, sents);
      out.senses.push({
        sense_id: sid, word_id: wid, order: si,
        anchor_l1: Array.isArray(sn.anchor_l1) ? sn.anchor_l1[0] : (sn.anchor_l1 || sn.def_l1 || sn.zh || ""),
        anchor_l2: Array.isArray(sn.anchor_l2) ? sn.anchor_l2[0] : (sn.anchor_l2 || sn.def_l2 || sn.en || ""),
        etymology: sn.etymology || "", has_nearsyn: !!sn.has_nearsyn, academic: !!sn.academic,
        sequence_like: !!(sn.sequence_like || /^(phrase|collocation|idiom)$/i.test(w.pos || "")),
        flagged: chk.needsFix, topic_count: chk.topics, issues: chk.issues, created_at: now()
      });
      if (chk.needsFix) out.flagged.push({ lemma: lemma, sense: si + 1, anchor: sn.anchor_l1 || sn.anchor_l2 || "", reason: chk.issues.join("；") });
      sents.forEach((x, xi) => {
        out.sentences.push({
          sentence_id: uid("sn"), sense_id: sid,
          text: (x.text || x.sentence || "").trim(),
          translation: x.translation || x.trans || "",
          source: x.source || "", topic_tag: x.topic_tag || x.topic || ("T" + (xi + 1)),

}
/** CSV 简易格式：lemma,pos,freq,concrete,anchor_l1,anchor_l2,e1,e2,e3,t1,t2,t3 */
function parseImportCSV(text) {

    const o = {}; head.forEach((h, i) => (o[h] = (cells[i] || "").trim()));
    const sens = [];
    for (let i = 1; i <= 5; i++) if (o["e" + i]) {
      sens.push({ text: o["e" + i], translation: o["t" + i + "_cn"] || "", topic_tag: o["t" + i] || ("T" + i) });
    }

    const t = x.topic_tag || "misc"; cnt[t] = (cnt[t] || 0) + 1;
  }));

}
function logsToday(modeFilter) {

}
function distinctCardsToday() { return new Set(logsToday("regular").map((l) => l.card_id)).size; }

  return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 15000;

/** 今日到期量预测（不含睡前任务 —— FR-M7-04） */
function todayDueCount() {
  const t = now();
  const newCap = Math.max(0, settings().dailyNewLimit - introducedToday());
  let due = 0;
  S.cache.cards.forEach((c) => { if (c.state !== "mastered" && c.due_at <= t) due++; });
  return { due: Math.min(due, Math.max(0, settings().dailyReviewLimit - distinctCardsToday())), dueRaw: due, newLeft: newCap };
}

/** 构造会话队列。mode: regular | sleep */
function buildQueue(mode) {
  const st = settings(), t = now();
  if (mode === "sleep") {
    // FR-M7-01：仅含当日已完成过提取练习的词，不含新词
    const done = new Set(logsToday("regular").map((l) => l.card_id));
    const budget = Math.max(1, Math.round((st.sleep.targetMin * 60000) / meanInteractionMs()));
    let pool = S.cache.cards.filter((c) => done.has(c.card_id) && c.state !== "mastered" && c.introduced_at > 0);
    pool = spreadByWord(pool.sort((a, b) => (b.mastery === 0 ? 1 : 0) - (a.mastery === 0 ? 1 : 0) || a.due_at - b.due_at));
    return { list: pool.slice(0, budget), estMs: budget * meanInteractionMs(), mode: "sleep" };
  }
  const revCap = Math.max(0, st.dailyReviewLimit - distinctCardsToday());
  let due = S.cache.cards.filter((c) => c.state !== "mastered" && c.due_at <= t).sort((a, b) => a.due_at - b.due_at);
  const picked = due.slice(0, revCap);
  // 已到期的新词不再重复计入「新词」额度，避免同一张卡一会话出现两次
  const pickedIds = new Set(picked.map((c) => c.card_id));
  const newCap = Math.max(0, st.dailyNewLimit - introducedToday());
  const news = S.cache.cards.filter((c) => c.state === "new" && !pickedIds.has(c.card_id))
    .sort((a, b) => a.created_at - b.created_at).slice(0, newCap);
  let list = picked.concat(news);
  // 交错练习解锁：低掌握度按语义块成组，达标者打乱交错（FR-M2-05）
  const low = list.filter((c) => (c.mastery || 0) < st.interleaveMastery);
  const high = list.filter((c) => (c.mastery || 0) >= st.interleaveMastery);
  low.sort((a, b) => String(topicOfWord(idx.word(a.word_id))).localeCompare(String(topicOfWord(idx.word(b.word_id)))) || a.due_at - b.due_at);
  shuffle(high);
  list = low.concat(high);
  // 选择题占比上限（FR-M3-05）
  let mcq = 0;
  list.forEach((c) => { if (c._qtype === "mcq") mcq++; });
  const maxMcq = Math.floor(list.length * st.mcqMaxRatio);
  list.forEach((c) => { if (c._qtype === "mcq" && mcq > maxMcq) { c._qtype = "recall"; mcq--; } });
  return { list: spreadByWord(list), estMs: list.length * meanInteractionMs(), newCount: news.length, reviewed: picked.length };
}

function spreadByWord(list) {
  const out = [], byW = {};
  list.forEach((c) => { (byW[c.word_id] = byW[c.word_id] || []).push(c); });
  let remain = true;
  while (remain) {
    remain = false;
    const keys = Object.keys(byW).filter((k) => byW[k].length);
    shuffle(keys);
    for (const k of keys) {
      if (!byW[k].length) continue;
      const lastW = out.length ? out[out.length - 1].word_id : null;
      if (lastW === k && keys.length > 1) continue;
      out.push(byW[k].shift()); remain = true;
    }
  }

}

/** 7.1 掌握度迁移 + 7.3 间隔决策。返回本次调度结果 */
function gradeCard(card, jol, rtMs, opts) {
  const st = settings();
  const mode = (opts && opts.mode) || "regular";
  const t = now();
  const fast = rtMs <= rtThreshold();
  // JOL → FSRS 四档评级（由题意面试题三档映射；RT 达标视为 Easy）
  const fsrsRating = jol === 0 ? 1 : (jol === 1 ? 2 : (fast ? 4 : 3));
  const prevMastery = card.mastery || 0;
  const isFirstContact = !card.reps;
  const elapsedDays = card.last_reviewed_at ? Math.max(0, (t - card.last_reviewed_at) / DAY) : 0;

  // --- 掌握度迁移（7.1） ---
  let mastery = prevMastery;
  if (jol === 0) mastery = 0;
  else if (jol === 1) mastery = (prevMastery >= 2) ? 1 : prevMastery;
  else if (jol === 2) mastery = fast ? Math.min(3, (isFirstContact ? 1 : prevMastery + 1)) : (isFirstContact ? 1 : prevMastery);

  // --- 连续成功计数与放行判定（7.2） ---
  let successive = card.successive || 0;
  if (jol === 0) successive = 0; else successive++;
  const wasReleased = card.state === "review" || card.state === "mastered";
  const released = wasReleased || successive >= st.releaseStreak;

  // --- FSRS 预测层 ---
  const fState = isFirstContact
    ? FSRS.initState(fsrsRating === 1 ? 2 : fsrsRating, st.fsrsParams)
    : { stability: card.stability, difficulty: card.difficulty };
  let fsrs = null, ivlDays = 0;
  if (jol === 0) {
    const r = FSRS.review(fState, 1, elapsedDays, st.requestRetention, st.fsrsParams, st.maximumIntervalDays);
    fsrs = r; ivlDays = INTENSIVE_MIN_MS / DAY;                 // 失败 → 短间隔，回密集队列
  } else {
    fsrs = FSRS.review(fState, fsrsRating, elapsedDays, st.requestRetention, st.fsrsParams, st.maximumIntervalDays);
    ivlDays = fsrs.intervalDays;
    const baseM2disk = FSRS.review(fState, 3, elapsedDays, st.requestRetention, st.fsrsParams, st.maximumIntervalDays).intervalDays;
    if (mastery === 1) ivlDays = Math.min(ivlDays, st.m1GrowthCap * baseM2disk);   // FR-M2-04
    if (jol === 2 && !fast && mastery < 3) {                                       // RT 超标 → 间隔不增长
      const prevOk = card.last_success_interval_days || 0;
      ivlDays = prevOk > 0 ? Math.min(ivlDays, prevOk) : Math.min(ivlDays, Math.max(1, card.last_interval_days || 0));
    }
    if (!released) ivlDays = INTENSIVE_MIN_MS / DAY;                               // 7.2 未放行前不拉长间隔
  }
  ivlDays = clamp(ivlDays, INTENSIVE_MIN_MS / DAY, st.maximumIntervalDays);

  // --- 写回卡片 ---
  card.mastery = mastery; card.successive = successive; card.reps = (card.reps || 0) + 1;
  card.last_reviewed_at = t; card.last_rt_ms = rtMs; card.last_jol = jol;
  card.stability = fsrs.stability; card.difficulty = fsrs.difficulty; card.retrievability = fsrs.retrievability;
  if (jol === 0) card.lapses = (card.lapses || 0) + 1;
  let state = "review";
  if (jol === 0 || !released) state = "learning";

  card.state = state;

    if (jol !== 0) card.last_success_interval_days = Math.max(card.last_success_interval_days || 0, ivlDays);
  } else {
    card.last_interval_days = ivlDays;
    if (jol !== 0 && state !== "learning") card.last_success_interval_days = ivlDays;
    card.due_at = t + Math.round(ivlDays * DAY);
  }

  // --- 不可变日志（6.2 约束） ---
  const sense = idx.sense(card.sense_id);
  const log = {
    card_id: card.card_id, sense_id: card.sense_id, word_id: card.word_id, reviewed_at: t,
    jol: jol, fsrs_rating: fsrsRating, rt_ms: rtMs, total_ms: (opts && opts.total_ms) || rtMs,
    shown_sentence_id: (opts && opts.sentence_id) || null, card_type: card.card_type, mode: mode,
    elapsed_days: Math.round(elapsedDays * 1000) / 1000, prev_interval_days: Math.round(prevInterval * 1000) / 1000,
    next_interval_days: Math.round(ivlDays * 1000) / 1000, mastery_after: mastery, state_after: state,
    fast: fast, topic: sense ? topicOfWord(idx.word(card.word_id)) : "misc"
  };
  // --- 卡片状态可追溯 ---
  const hist = { hid: uid("h"), card_id: card.card_id, at: t, from_mastery: prevMastery, to_mastery: mastery, jol: jol, mode: mode, due_shift_days: mode === "sleep" ? 0 : ivlDays };
  return { log, hist, card, ivlDays, mastery, state, fsrsRating, prevMastery, released, fast, elapsedDays };

    const p = m[2] || "/";                       // 取 base 的「目录部分」，文件名不算目录

    if (html.length > UI_MAX_CACHE_CHARS) return { status: "too-big", version: ver, note: note, size: html.length };

    catch (e) { return { status: "cache-fail", version: ver, note: note }; }
    return { status: "ready", version: ver, note: note };

async function copyText(text) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (e) { }
  try {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.cssText = "position:fixed;left:-9999px";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy");
    ta.remove(); return ok;
  } catch (e) { return false; }
}

   10. M9 数据统计
   ========================================================================== */
function activeCards() { return S.cache.cards.filter((c) => c.reps > 0 || c.introduced_at); }
function masteryDistribution() {
  const arr = [0, 0, 0, 0];
  S.cache.cards.forEach((c) => { arr[c.mastery || 0]++; });
  return arr.map((n, i) => ({ k: MASTERY[i].k, n: n, nm: MASTERY[i].n }));
}
/** 接受性（听读）vs 产出性（说写）知识占比 FR-M9-01 */
function receptiveSplit(scopeCards) {
  const cards = scopeCards || S.cache.cards;
  let rec = 0, pro = 0, recR = 0, proR = 0;
  cards.forEach((c) => {
    const t = CARD_TYPES[c.card_type] || CARD_TYPES.meaning;
    if (t.receptive) { rec++; if ((c.mastery || 0) >= 2) recR++; }
    else { pro++; if ((c.mastery || 0) >= 2) proR++; }
  });
  return { rec, pro, recR, proR, recRate: rec ? recR / rec : 0, proRate: pro ? proR / pro : 0 };
}
/** 延迟保持率：距上次复习 ≥N 天且期间无复习的那次提取的正确率 */
function delayedRetention(days) {
  let n = 0, ok = 0;
  S.cache.logs.forEach((l) => {
    if ((l.mode || "regular") !== "regular") return;
    if (l.elapsed_days != null && l.elapsed_days >= days) { n++; if (l.jol > 0) ok++; }
  });
  return { n: n, rate: n ? ok / n : null, ok: ok };
}
function firstDaySuccess() {
  const firsts = new Map();
  S.cache.logs.forEach((l) => { if (!firsts.has(l.card_id)) firsts.set(l.card_id, l); });
  let n = 0, ok = 0;
  firsts.forEach((l) => { n++; if (l.jol > 0) ok++; });
  return { n: n, rate: n ? ok / n : null };
}
function efficiency() {
  const m3 = new Set(S.cache.logs.filter((l) => l.mastery_after === 3).map((l) => l.card_id)).size;
  const ms = S.cache.logs.reduce((a, l) => a + (l.total_ms || 0), 0);
  return { m3: m3, hours: ms / 3600000, perHour: ms > 0 ? m3 / (ms / 3600000) : null };
}
function computeHealth() {
  const r7 = delayedRetention(7), r30 = delayedRetention(30), fd = firstDaySuccess();
  return { retention7: r7.rate, r7n: r7.n, retention30: r30.rate, r30n: r30.n, firstDaySuccess: fd.rate, firstDayN: fd.n };
}
function rtCurve() {
  const byRep = {};
  const order = {};
  S.cache.logs.forEach((l) => {
    order[l.card_id] = (order[l.card_id] || 0) + 1;
    const k = Math.min(8, order[l.card_id]);
    (byRep[k] = byRep[k] || []).push(l.rt_ms);
  });
  return [1, 2, 3, 4, 5, 6, 7, 8].map((k) => ({
    k: k, n: (byRep[k] || []).length,
    mean: (byRep[k] && byRep[k].length) ? byRep[k].reduce((a, b) => a + b, 0) / byRep[k].length : null,
    median: (byRep[k] && byRep[k].length) ? median(byRep[k]) : null
  }));
}
function median(a) { const b = a.slice().sort((x, y) => x - y); const m = Math.floor(b.length / 2); return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; }

function drawRTChart(rows) {
  const cv = $("rtchart"); if (!cv || rows.length < 2) return;
  const g = cv.getContext("2d"), W = cv.width, H = cv.height, P = 34;
  g.clearRect(0, 0, W, H);

  for (let i = 0; i <= 4; i++) {
    const y = P + (H - 2 * P) * i / 4;
    g.beginPath(); g.moveTo(P, y); g.lineTo(W - P, y); g.stroke();
    g.fillText(fmtDur(max * (1 - i / 4)), 2, y + 4);
  }
  rows.forEach((r, i) => { const x = P + (W - 2 * P) * i / (rows.length - 1); g.fillText("" + r.k, x - 3, H - P + 16); });
  g.beginPath(); g.strokeStyle = "#2563eb"; g.lineWidth = 2.4;
  rows.forEach((r, i) => {
    const x = P + (W - 2 * P) * i / (rows.length - 1), y = P + (H - 2 * P) * (1 - (r.median || 0) / max);
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  });
  g.stroke();
  rows.forEach((r, i) => {
    const x = P + (W - 2 * P) * i / (rows.length - 1), y = P + (H - 2 * P) * (1 - (r.median || 0) / max);
    g.fillStyle = "#2563eb"; g.beginPath(); g.arc(x, y, 3.4, 0, 7); g.fill();
  });
}

    const opts = shuffle(pool.slice()).slice(0, 3).map((x) => x[1]);
    opts.push(it[1]); shuffle(opts);
    return { word: it[0], answer: it[1], band: it[2], opts: opts };
  });
  const body = el("div");
  const head = el("div", "small muted", "选出与左边单词相符的意思。共 " + items.length + " 题， stratified 按 5 个词频段抽样；这是<b>分班估计</b>，结果不计入学习进度。");
  body.appendChild(head);
  const list = el("div"); list.style.marginTop = "8px";
  const picks = {};
  items.forEach((it, i) => {
    const box = el("div", "card"); box.style.cssText = "padding:10px;margin-bottom:8px;box-shadow:none";
    box.innerHTML = '<div><b>' + esc(it.word) + '</b></div>';
    it.opts.forEach((o) => {
      const b = el("button", "btn sm block", esc(o));
      b.style.cssText = "text-align:left;margin-top:5px";
      b.onclick = () => { picks[i] = o; box.querySelectorAll("button").forEach((x) => (x.className = "btn sm block")); b.className = "btn sm block primary"; };
      box.appendChild(b);
    });
    list.appendChild(box);
  });
  body.appendChild(list);
  modal("词汇量自测（约 3 分钟）", body, [
    { t: "取消" },
    { t: "提交并推荐档位", p: true, fn: () => {
        const correct = [0, 0, 0, 0, 0], total = [0, 0, 0, 0, 0];
        items.forEach((it, i) => { total[it.band - 1]++; if (picks[i] === it.answer) correct[it.band - 1]++; });
        let est = 0;
        for (let b = 0; b < 5; b++) est += VST_WEIGHTS[b] * (correct[b] / (total[b] || 1));
        est = Math.round(est / 50) * 50;
        const band = est < 2000 ? "L1" : est < 4000 ? "L2" : est < 8000 ? "L3" : "L4";
        setTimeout(() => recommendBand(est, band), 60);
      } }
  ]);
}
async function recommendBand(est, band) {
  S.profile.vocab_size = est; S.profile.tested_at = now();
  await DB.kv.set("profile", S.profile);
  await saveSettings({ firstRunDone: true });
  const cur = settings().band;
  const b = el("div");
  b.innerHTML = '<div class="infobox">估计词汇量约 <b>' + est + '</b> 词族（分频段抽样估算，仅供默认档位推荐）。<br>推荐默认档位：<b>' + BANDS[band].name + "</b>　当前：" + cur + "</div>" +
    '<div class="tiny muted" style="margin-top:8px">这不是对你的分层：档位随时可在设置里切换，且只影响「释义语言、配图策略」这些默认参数，不参与任何评价或排名。</div>';
  modal("自测结果", b, [
    { t: "保持当前 " + cur },
    { t: "切到 " + band + "（推荐）", p: true, fn: async () => { await switchBand(band); go("home"); } }
  ]);
}

/* ---------- 自检：把论文里的硬约束变成可执行断言 ---------- */
async function runSelfTest() {
  const R = [];
  const ok = (name, cond, detail) => R.push({ name, pass: !!cond, detail: detail || "" });
  try {
    FSRS.fuzz = false;
    // FSRS 基本性质
    ok("FSRS R(0)=1", Math.abs(FSRS.retrievability(0, 5) - 1) < 1e-6, "R(0)=" + FSRS.retrievability(0, 5).toFixed(4));
    ok("FSRS 可提取性随时间单调下降", FSRS.retrievability(1, 5) > FSRS.retrievability(5, 5) && FSRS.retrievability(5, 5) > FSRS.retrievability(30, 5));
    const st0 = FSRS.initState(3, FSRS.w);
    const ivl = FSRS.intervalForRetention(st0.stability, 0.9, FSRS.w);
    ok("FSRS S0 official anchor ≈1 天", ivl > 0.85 && ivl < 1.1, "S0=" + st0.stability.toFixed(3) + "，I(0.9)=" + ivl.toFixed(3) + " 天");
    const s1 = FSRS.review({ stability: 5, difficulty: 5 }, 3, 5, 0.9, FSRS.w, 365);
    const s2 = FSRS.review({ stability: 5, difficulty: 5 }, 1, 5, 0.9, FSRS.w, 365);
    ok("Good 增稳 / Again 降稳", s1.stability > 5 && s2.stability < 5, "Good→" + s1.stability.toFixed(2) + "，Again→" + s2.stability.toFixed(2));
    ok("Again 后不得拉长间隔", s2.intervalDays < s1.intervalDays);
    FSRS.fuzz = settings().fsrsFuzz;
    // 7.1 掌握度迁移表
    const mk = (m) => ({ card_id: "t", sense_id: "s", word_id: "w", card_type: "meaning", state: "review", due_at: now(), stability: 3, difficulty: 5, mastery: m, reps: 1, successive: 3, lapses: 0, last_interval_days: 2, last_success_interval_days: 2, introduced_at: 1, mastery0: m });
    const g = (m, jol, rt) => gradeCard(mk(m), jol, rt, {});
    ok("想不起来 → M0", g(2, 0, 1000).mastery === 0);
    ok("模糊：M2→M1", g(2, 1, 1000).mastery === 1);
    ok("模糊：M1 保持", g(1, 1, 1000).mastery === 1);
    ok("想起且 RT 达标 → 升一级（封顶 M3）", g(2, 2, 500).mastery === 3 && g(3, 2, 500).mastery === 3);
    ok("想起但 RT 超标 → 不升级", g(1, 2, 99999).mastery === 1);
    // 7.2 放行前不拉长间隔
    const nw = { card_id: "n", sense_id: "s", word_id: "w", card_type: "meaning", state: "new", due_at: now(), stability: 0, difficulty: 0, mastery: 0, reps: 0, successive: 0, lapses: 0, last_interval_days: 0, introduced_at: 0 };
    const r1 = gradeCard(JSON.parse(JSON.stringify(nw)), 2, 500, {});
    ok("新词首次成功仍在密集队列（<1 天）", r1.ivlDays < 1 && r1.state === "learning", "间隔 " + fmtDur(r1.ivlDays * DAY));
    const c2 = JSON.parse(JSON.stringify(nw)); c2.successive = (settings().releaseStreak - 1); c2.reps = 2; c2.stability = 2; c2.difficulty = 5; c2.introduced_at = 1; c2.last_interval_days = 0.1;
    const r2 = gradeCard(c2, 2, 500, {});
    ok("达成连续成功 → 放行到常规队列", r2.released === true && r2.state !== "learning");
    // FR-M2-04 M1 间隔 60% 上限
    const cm1 = mk(0); cm1.mastery = 0;
    const rm1 = gradeCard(cm1, 1, 1000, {});
    const base = FSRS.review({ stability: cm1.stability, difficulty: cm1.difficulty }, 3, 0, 0.9, FSRS.w, 365).intervalDays;
    ok("M1 间隔 ≤ M2 基准 60%", rm1.mastery <= 1 && rm1.ivlDays <= base * settings().m1GrowthCap + 1e-6, "实际 " + rm1.ivlDays.toFixed(3) + " ≤ " + (base * settings().m1GrowthCap).toFixed(3));
    // FR-M7-04 睡前不改到期
    const sc = mk(2); sc.due_at = 12345;
    const rs = gradeCard(sc, 2, 500, { mode: "sleep" });
    ok("睡前巩固不改动到期时间（不加次日负担）", rs.card.due_at === 12345);
    // 例句轮换：连续 10 次不重复
    const sid = (S.cache.senses[0] || {}).sense_id;
    if (sid && idx.sentencesOf(sid).length >= 2) {
      let last = null, rep = 0;
      for (let i = 0; i < 10; i++) { const p = pickSentence(sid, last); if (last && p.sentence && p.sentence.sentence_id === last) rep++; last = p.sentence ? p.sentence.sentence_id : null; }
      ok("例句轮换：连续 10 次重复率 0", rep === 0, "重复 " + rep + " 次");
    } else ok("例句轮换", true, "（无本地数据，跳过）");
  } catch (e) { R.push({ name: "执行异常", pass: false, detail: e.message }); }
  return R;
}
function showSelfTest(R) {
  const pass = R.filter((r) => r.pass).length;
  const body = el("div");
  body.innerHTML = '<div class="' + (pass === R.length ? "infobox" : "warnbox") + '">' + pass + " / " + R.length + " 项通过</div>" +
    R.map((r) => '<div class="row small" style="align-items:flex-start;margin-top:7px"><span class="badge ' + (r.pass ? "ok" : "warn") + '">' + (r.pass ? "PASS" : "FAIL") + "</span><div>" + esc(r.name) + (r.detail ? '<div class="tiny muted">' + esc(r.detail) + "</div>" : "") + "</div></div>").join("");
  modal("算法自检", body, [{ t: "关闭", p: true }]);
}

/* ==========================================================================
   12. 启动
   ========================================================================== */
function maybeNotify() {
  const st = settings();
  if (!st.sleep.enabled || isInDND() || st.sleepDoneKey === dayKey(now())) return;
  if (!inSleepWindow()) return;
  const eligible = new Set(logsToday("regular").map((l) => l.card_id)).size;
  if (!eligible) return;
  try {
    if (typeof Notification !== "undefined" && Notification.permission === "granted") {
      const n = new Notification("睡前巩固 · " + eligible + " 个词", { body: "只做一轮轻量提取，不加次日负担。" });
      n.onclick = () => studySession("sleep");
    }
  } catch (e) { }
}
async function boot() {
  await loadAll();
  document.querySelectorAll("#nav button").forEach((b) => { b.onclick = () => go(b.dataset.v); });
  updateTopChips();
  go("home");
  setInterval(() => { if (currentView === "home") { maybeNotify(); } updateTopChips(); }, 60000);
  maybeNotify();
  // 启动后异步检查界面更新（失败不影响使用；已缓存的新版本下次启动自动生效）
  setTimeout(async () => {
    if (settings().uiRemoteUpdate === false || !uiManifestUrl()) return;
    const r = await checkUiUpdate();
    if (r.status === "ready") showUpdateBanner(r);
  }, 2500);
  if (typeof Notification !== "undefined" && Notification.permission === "default" && settings().sleep.enabled) {
    document.addEventListener("click", function once() {
      document.removeEventListener("click", once);
      try { Notification.requestPermission(); } catch (e) { }
    });
  }
  if (S.cache.words.length && !S.profile.tested_at && !S.settings.firstRunDone) {
    const b = el("div");
    b.innerHTML = '<div class="infobox">词库里已有 ' + S.cache.words.length + ' 个词条。做一次词汇量自测可以推荐一个合适的默认档位（决定释义语言等默认参数），也可以直接在设置里选。<br><br>这不是分层，随时可改。</div>';
    modal("先定个默认档位？", b, [
      { t: "跳过" },
      { t: "去设置里选", fn: () => go("settings") },
      { t: "做自测（约 3 分钟）", p: true, fn: async () => { await saveSettings({ firstRunDone: true }); setTimeout(openVocabTest, 80); } }
    ]);
  }
  window.RC = { FSRS, gradeCard, pickSentence, buildQueue, S, settings, runSelfTest, validateSense, delayedRetention, firstDaySuccess, computeHealth, go, refreshCache };
}
boot().catch((e) => { document.body.innerHTML = '<div style="padding:30px;font-family:sans-serif">初始化失败：' + esc(e.message) + "</div>"; });
